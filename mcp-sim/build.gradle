plugins {
    id 'java'
    id 'application'
    id 'org.openjfx.javafxplugin' version '0.1.0'
}

group = 'com.trafficsim'
version = '1.0.0'

java {
    sourceCompatibility = '17'
    targetCompatibility = '17'
}

tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
}

repositories {
    mavenCentral()
}

dependencies {
    // MCP SDK
    implementation platform('io.modelcontextprotocol.sdk:mcp-bom:0.13.1')
    implementation 'io.modelcontextprotocol.sdk:mcp:0.13.1'

    // Logging
    implementation 'org.slf4j:slf4j-simple:2.0.9'

    // Embedded Jetty server for HTTP transport
    implementation 'org.eclipse.jetty:jetty-server:11.0.20'
    implementation 'org.eclipse.jetty:jetty-servlet:11.0.20'
    implementation 'jakarta.servlet:jakarta.servlet-api:5.0.0'

    // JavaFX dependencies
    implementation 'org.openjfx:javafx-controls:21.0.1'
    implementation 'org.openjfx:javafx-fxml:21.0.1'
    implementation 'org.openjfx:javafx-graphics:21.0.1'

    // Jackson for JSON processing
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.15.2'

    // CLI argument parsing
    implementation 'info.picocli:picocli:4.7.5'

    // Testing
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.0'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

javafx {
    version = "21.0.1"
    modules = ['javafx.controls', 'javafx.fxml', 'javafx.graphics']
}

// Default application main class (JavaFX UI)
application {
    mainClass = 'com.trafficsim.ui.TrafficSimApp'
}

// MCP Server fat JAR task (manual implementation without shadow plugin)
tasks.register('serverJar', Jar) {
    archiveBaseName.set('traffic-sim-mcp-server')
    archiveClassifier.set('all')
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE

    manifest {
        attributes 'Main-Class': 'com.trafficsim.server.IntersectionMcpServer'
    }

    // Include compiled classes
    from sourceSets.main.output

    // Exclude UI classes
    exclude 'com/trafficsim/ui/**'

    // Include dependencies (excluding JavaFX)
    from {
        configurations.runtimeClasspath.findAll {
            !it.name.contains('javafx')
        }.collect { it.isDirectory() ? it : zipTree(it) }
    }
}

// Task to run MCP Server (standalone)
tasks.register('runServer', JavaExec) {
    group = 'application'
    description = 'Run the MCP Server'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.trafficsim.server.IntersectionMcpServer'
}

// Enable JUnit Platform (Jupiter)
tasks.named('test') {
    useJUnitPlatform()
}

// Create custom runtime distribution using jpackage directly
tasks.register('createRuntime', Exec) {
    group = 'distribution'
    description = 'Create runtime image using jpackage with JavaFX'

    dependsOn 'installDist'

    def outputDir = file("$buildDir/jpackage")
    def inputDir = file("$buildDir/install/${project.name}")

    doFirst {
        outputDir.mkdirs()

        // Get JavaFX module path from gradle cache
        def javafxModulePath = configurations.runtimeClasspath.files.findAll {
            it.name.contains('javafx') && it.name.endsWith('.jar')
        }.collect{ it.parent }.unique().join(File.pathSeparator)

        def jpackageCmd = [
                "${System.getProperty('java.home')}/bin/jpackage",
                '--type', 'app-image',
                '--name', 'mcp-sim',
                '--app-version', version,
                '--input', "${inputDir}/lib",
                '--main-jar', "${project.name}-${version}.jar",
                '--main-class', 'com.trafficsim.ui.TrafficSimApp',
                '--dest', outputDir.absolutePath,
                '--module-path', javafxModulePath,
                '--add-modules', 'javafx.controls,javafx.fxml,javafx.graphics'
        ]

        commandLine = jpackageCmd
    }
}
